<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Compute Kingdom</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f2;
      color: #222;
    }

    header {
      padding: 24px 30px 10px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 13px;
    }


    /* ========================================
       WORLD
    ======================================== */

    #world {
      position: relative;

      width: calc(100% - 40px);
      max-width: 1100px;
      height: 650px;

      margin: 20px auto;

      background: #e9ecdf;

      border: 1px solid #ddd;
      border-radius: 25px;

      overflow: hidden;
    }


    /* ========================================
       KINGDOM
    ======================================== */

    .kingdom {
      position: absolute;

      text-align: center;

      transform: translate(-50%, -50%);

      cursor: pointer;

      transition:
        transform 0.2s ease,
        filter 0.2s ease;
    }

    .kingdom:hover {
      transform:
        translate(-50%, -50%)
        scale(1.08);

      filter: brightness(1.04);
    }


    /* ========================================
       CASTLE
       Compute 규모를 표현
    ======================================== */

    .castle {
      display: flex;

      align-items: flex-end;
      justify-content: center;

      gap: 4px;

      height: 85px;

      user-select: none;
    }


    /* 기본 타워 */

    .tower {
      position: relative;

      width: 34px;
      height: 47px;

      background: #d8cfbd;

      border: 2px solid #aaa08d;

      border-radius: 3px 3px 0 0;
    }


    /* 빨간 지붕 */

    .tower::before {
      content: "";

      position: absolute;

      left: 50%;
      top: -22px;

      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 21px solid transparent;
      border-right: 21px solid transparent;

      border-bottom: 23px solid #c94f48;
    }


    /* 문 */

    .tower::after {
      content: "";

      position: absolute;

      width: 9px;
      height: 15px;

      bottom: 0;
      left: 50%;

      transform: translateX(-50%);

      background: #554b40;

      border-radius: 5px 5px 0 0;
    }


    /* 메인 타워 */

    .tower.main {
      width: 42px;
      height: 61px;

      background: #e1d8c6;
    }

    .tower.main::before {
      border-left-width: 25px;
      border-right-width: 25px;
      border-bottom-width: 27px;

      top: -26px;
    }


    /* ========================================
       COMPANY NAME
    ======================================== */

    .company {
      margin-top: 8px;

      font-size: 13px;
      font-weight: bold;

      letter-spacing: 0.5px;
    }


    /* ========================================
       ★ V0.3 POWER SYSTEM
       전력 규모를 번개 개수로 표현
    ======================================== */

    .power {
      margin-top: 6px;

      min-height: 24px;

      font-size: 20px;

      letter-spacing: 2px;

      user-select: none;
    }

    .power-label {
      margin-top: 2px;

      font-size: 9px;

      color: #777;

      letter-spacing: 1px;
    }


    /* ========================================
       COMPANY POSITION
    ======================================== */

    #google {
      left: 50%;
      top: 17%;
    }

    #aws {
      left: 25%;
      top: 36%;
    }

    #xai {
      left: 75%;
      top: 36%;
    }

    #meta {
      left: 50%;
      top: 56%;
    }

    #microsoft {
      left: 24%;
      top: 78%;
    }

    #oracle {
      left: 76%;
      top: 78%;
    }


    /* ========================================
       INFO PANEL
    ======================================== */

    #info {
      position: absolute;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      width: 310px;

      padding: 18px;

      background: rgba(255,255,255,0.96);

      border: 1px solid rgba(0,0,0,0.06);

      border-radius: 14px;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.12);

      display: none;

      z-index: 20;
    }

    #info h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    #info p {
      margin: 5px 0;
      font-size: 13px;
    }

    .status {
      color: #888;
    }


    /* ========================================
       LEGEND
    ======================================== */

    .legend {
      position: absolute;

      right: 18px;
      top: 18px;

      padding: 10px 13px;

      background: rgba(255,255,255,0.75);

      border-radius: 10px;

      font-size: 11px;
      line-height: 1.6;

      color: #666;
    }


    footer {
      text-align: center;

      font-size: 11px;

      color: #999;

      padding: 10px 0 30px;
    }


    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 600px) {

      #world {
        height: 700px;
      }

      .legend {
        display: none;
      }

      #aws {
        left: 23%;
      }

      #xai {
        left: 77%;
      }

      #microsoft {
        left: 23%;
      }

      #oracle {
        left: 77%;
      }

    }

  </style>
</head>


<body>


<header>

  <h1>🏰 Compute Kingdom</h1>

  <div class="subtitle">
    Visualizing the global AI compute race
  </div>

</header>



<div id="world">


  <!-- ========================================
       LEGEND
  ======================================== -->

  <div class="legend">

    🏰 Castle = Compute<br>
    ⚡ Power = Energy Capacity<br>
    Prototype V0.3

  </div>



  <!-- ========================================
       GOOGLE
       Compute : Tier 3
       Power   : Tier 3
  ======================================== -->

  <div
    class="kingdom"
    id="google"

    data-company="Google"
    data-compute-tier="3"
    data-power="3"
  >

    <div class="castle">

      <div class="tower"></div>

      <div class="tower main"></div>

      <div class="tower"></div>

    </div>

    <div class="company">
      GOOGLE
    </div>

    <!-- ★ POWER -->
    <div class="power">
      ⚡⚡⚡
    </div>

    <div class="power-label">
      POWER
    </div>

  </div>



  <!-- ========================================
       AWS
       Compute : Tier 3
       Power   : Tier 3
  ======================================== -->

  <div
    class="kingdom"
    id="aws"

    data-company="AWS"
    data-compute-tier="3"
    data-power="3"
  >

    <div class="castle">

      <div class="tower"></div>

      <div class="tower main"></div>

      <div class="tower"></div>

    </div>

    <div class="company">
      AWS
    </div>

    <!-- ★ POWER -->
    <div class="power">
      ⚡⚡⚡
    </div>

    <div class="power-label">
      POWER
    </div>

  </div>



  <!-- ========================================
       xAI
       Compute : Tier 2
       Power   : Tier 2
  ======================================== -->

  <div
    class="kingdom"
    id="xai"

    data-company="xAI"
    data-compute-tier="2"
    data-power="2"
  >

    <div class="castle">

      <div class="tower main"></div>

      <div class="tower"></div>

    </div>

    <div class="company">
      xAI
    </div>

    <!-- ★ POWER -->
    <div class="power">
      ⚡⚡
    </div>

    <div class="power-label">
      POWER
    </div>

  </div>



  <!-- ========================================
       META
       Compute : Tier 2
       Power   : Tier 2
  ======================================== -->

  <div
    class="kingdom"
    id="meta"

    data-company="Meta"
    data-compute-tier="2"
    data-power="2"
  >

    <div class="castle">

      <div class="tower main"></div>

      <div class="tower"></div>

    </div>

    <div class="company">
      META
    </div>

    <!-- ★ POWER -->
    <div class="power">
      ⚡⚡
    </div>

    <div class="power-label">
      POWER
    </div>

  </div>



  <!-- ========================================
       MICROSOFT
       Compute : Tier 1
       Power   : Tier 2
  ======================================== -->

  <div
    class="kingdom"
    id="microsoft"

    data-company="Microsoft"
    data-compute-tier="1"
    data-power="2"
  >

    <div class="castle">

      <div class="tower main"></div>

    </div>

    <div class="company">
      MICROSOFT
    </div>

    <!-- ★ POWER -->
    <div class="power">
      ⚡⚡
    </div>

    <div class="power-label">
      POWER
    </div>

  </div>



  <!-- ========================================
       ORACLE
       Compute : Tier 1
       Power   : Tier 1
  ======================================== -->

  <div
    class="kingdom"
    id="oracle"

    data-company="Oracle"
    data-compute-tier="1"
    data-power="1"
  >

    <div class="castle">

      <div class="tower main"></div>

    </div>

    <div class="company">
      ORACLE
    </div>

    <!-- ★ POWER -->
    <div class="power">
      ⚡
    </div>

    <div class="power-label">
      POWER
    </div>

  </div>



  <!-- ========================================
       DETAIL INFO
  ======================================== -->

  <div id="info">

    <h2 id="info-company"></h2>

    <p>
      Compute Tier :
      <strong id="info-compute"></strong>
    </p>

    <p>
      Power Tier :
      <strong id="info-power"></strong>
    </p>

    <p class="status">
      ⚠ Prototype data
    </p>

  </div>


</div>



<footer>

  Compute Kingdom • Prototype V0.3

</footer>



<script>

  const kingdoms =
    document.querySelectorAll(".kingdom");

  const info =
    document.getElementById("info");

  const infoCompany =
    document.getElementById("info-company");

  const infoCompute =
    document.getElementById("info-compute");

  const infoPower =
    document.getElementById("info-power");


  kingdoms.forEach((kingdom) => {

    kingdom.addEventListener("click", () => {

      const powerLevel =
        Number(kingdom.dataset.power);

      infoCompany.textContent =
        kingdom.dataset.company;

      infoCompute.textContent =
        "Tier " + kingdom.dataset.computeTier;

      infoPower.textContent =
        "⚡".repeat(powerLevel);

      info.style.display =
        "block";

    });

  });

</script>


</body>
</html>
