<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Compute Kingdom</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f2;
      color: #222;
    }

    header {
      padding: 24px 30px 10px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 13px;
    }

    #world {
      position: relative;

      width: calc(100% - 40px);
      max-width: 1100px;
      height: 650px;

      margin: 20px auto;

      background: #e9ecdf;

      border: 1px solid #ddd;
      border-radius: 25px;

      overflow: hidden;
    }


    /* =========================
       KINGDOM
    ========================= */

    .kingdom {
      position: absolute;

      text-align: center;

      transform: translate(-50%, -50%);

      cursor: pointer;

      transition:
        transform 0.2s ease,
        filter 0.2s ease;
    }

    .kingdom:hover {
      transform:
        translate(-50%, -50%)
        scale(1.08);

      filter: brightness(1.04);
    }


    /* =========================
       CASTLE
    ========================= */

    .castle {
      display: flex;

      align-items: flex-end;
      justify-content: center;

      gap: 4px;

      height: 85px;

      user-select: none;
    }


    /* 기본 타워 */

    .tower {
      position: relative;

      width: 34px;
      height: 47px;

      background: #d8cfbd;

      border: 2px solid #aaa08d;

      border-radius: 3px 3px 0 0;
    }


    /* 빨간 지붕 */

    .tower::before {
      content: "";

      position: absolute;

      left: 50%;
      top: -22px;

      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 21px solid transparent;
      border-right: 21px solid transparent;

      border-bottom: 23px solid #c94f48;
    }


    /* 문 */

    .tower::after {
      content: "";

      position: absolute;

      width: 9px;
      height: 15px;

      bottom: 0;
      left: 50%;

      transform: translateX(-50%);

      background: #554b40;

      border-radius: 5px 5px 0 0;
    }


    /* 가운데 메인 타워 */

    .tower.main {
      width: 42px;
      height: 61px;

      background: #e1d8c6;
    }

    .tower.main::before {
      border-left-width: 25px;
      border-right-width: 25px;
      border-bottom-width: 27px;

      top: -26px;
    }


    /* =========================
       COMPANY NAME
    ========================= */

    .company {
      margin-top: 8px;

      font-size: 13px;
      font-weight: bold;

      letter-spacing: 0.5px;
    }


    /* =========================
       COMPUTE BAR
    ========================= */

    .compute-bar {
      width: 90px;
      height: 6px;

      margin: 7px auto 0;

      background: rgba(0,0,0,0.12);

      border-radius: 10px;

      overflow: hidden;
    }

    .compute-fill {
      height: 100%;

      background: #555;

      border-radius: 10px;
    }


    /* =========================
       COMPANY POSITION
    ========================= */

    #google {
      left: 50%;
      top: 17%;
    }

    #aws {
      left: 25%;
      top: 35%;
    }

    #xai {
      left: 75%;
      top: 35%;
    }

    #meta {
      left: 50%;
      top: 55%;
    }

    #microsoft {
      left: 24%;
      top: 77%;
    }

    #oracle {
      left: 76%;
      top: 77%;
    }


    /* =========================
       INFO PANEL
    ========================= */

    #info {
      position: absolute;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      width: 310px;

      padding: 18px;

      background: rgba(255,255,255,0.96);

      border: 1px solid rgba(0,0,0,0.06);

      border-radius: 14px;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.12);

      display: none;

      z-index: 20;
    }

    #info h2 {
      margin: 0 0 10px;

      font-size: 18px;
    }

    #info p {
      margin: 5px 0;

      font-size: 13px;
    }

    .status {
      color: #888;
    }


    /* =========================
       LEGEND
    ========================= */

    .legend {
      position: absolute;

      right: 18px;
      top: 18px;

      padding: 10px 13px;

      background: rgba(255,255,255,0.72);

      border-radius: 10px;

      font-size: 11px;

      color: #666;
    }


    footer {
      text-align: center;

      font-size: 11px;

      color: #999;

      padding: 10px 0 30px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      #world {
        height: 700px;
      }

      .legend {
        display: none;
      }

      #aws {
        left: 23%;
      }

      #xai {
        left: 77%;
      }

      #microsoft {
        left: 23%;
      }

      #oracle {
        left: 77%;
      }

    }

  </style>
</head>


<body>


<header>

  <h1>
    🏰 Compute Kingdom
  </h1>

  <div class="subtitle">
    Visualizing the global AI compute race
  </div>

</header>



<div id="world">


  <!-- LEGEND -->

  <div class="legend">

    Castle size = Compute Tier<br>
    Prototype V0.2

  </div>



  <!-- =========================
       GOOGLE
       LARGE : 3 ROOFS
  ========================== -->

  <div
    class="kingdom"
    id="google"

    data-company="Google"
    data-tier="Large"
    data-compute="100"
    data-future="25"
  >

    <div class="castle">

      <div class="tower"></div>

      <div class="tower main"></div>

      <div class="tower"></div>

    </div>

    <div class="company">
      GOOGLE
    </div>

    <div class="compute-bar">

      <div
        class="compute-fill"
        style="width:100%">
      </div>

    </div>

  </div>



  <!-- =========================
       AWS
       LARGE : 3 ROOFS
  ========================== -->

  <div
    class="kingdom"
    id="aws"

    data-company="AWS"
    data-tier="Large"
    data-compute="85"
    data-future="40"
  >

    <div class="castle">

      <div class="tower"></div>

      <div class="tower main"></div>

      <div class="tower"></div>

    </div>

    <div class="company">
      AWS
    </div>

    <div class="compute-bar">

      <div
        class="compute-fill"
        style="width:85%">
      </div>

    </div>

  </div>



  <!-- =========================
       xAI
       MEDIUM : 2 ROOFS
  ========================== -->

  <div
    class="kingdom"
    id="xai"

    data-company="xAI"
    data-tier="Medium"
    data-compute="70"
    data-future="50"
  >

    <div class="castle">

      <div class="tower main"></div>

      <div class="tower"></div>

    </div>

    <div class="company">
      xAI
    </div>

    <div class="compute-bar">

      <div
        class="compute-fill"
        style="width:70%">
      </div>

    </div>

  </div>



  <!-- =========================
       META
       MEDIUM : 2 ROOFS
  ========================== -->

  <div
    class="kingdom"
    id="meta"

    data-company="Meta"
    data-tier="Medium"
    data-compute="65"
    data-future="45"
  >

    <div class="castle">

      <div class="tower main"></div>

      <div class="tower"></div>

    </div>

    <div class="company">
      META
    </div>

    <div class="compute-bar">

      <div
        class="compute-fill"
        style="width:65%">
      </div>

    </div>

  </div>



  <!-- =========================
       MICROSOFT
       SMALL : 1 ROOF
  ========================== -->

  <div
    class="kingdom"
    id="microsoft"

    data-company="Microsoft"
    data-tier="Small"
    data-compute="60"
    data-future="30"
  >

    <div class="castle">

      <div class="tower main"></div>

    </div>

    <div class="company">
      MICROSOFT
    </div>

    <div class="compute-bar">

      <div
        class="compute-fill"
        style="width:60%">
      </div>

    </div>

  </div>



  <!-- =========================
       ORACLE
       SMALL : 1 ROOF
  ========================== -->

  <div
    class="kingdom"
    id="oracle"

    data-company="Oracle"
    data-tier="Small"
    data-compute="50"
    data-future="35"
  >

    <div class="castle">

      <div class="tower main"></div>

    </div>

    <div class="company">
      ORACLE
    </div>

    <div class="compute-bar">

      <div
        class="compute-fill"
        style="width:50%">
      </div>

    </div>

  </div>



  <!-- =========================
       INFO PANEL
  ========================== -->

  <div id="info">

    <h2 id="info-company">
    </h2>

    <p>
      Castle Tier :
      <strong id="info-tier"></strong>
    </p>

    <p>
      Current Compute :
      <strong id="info-compute"></strong>
    </p>

    <p>
      Future Compute :
      <strong id="info-future"></strong>
    </p>

    <p class="status">
      ⚠ Prototype data — not actual compute ranking
    </p>

  </div>


</div>



<footer>

  Compute Kingdom • Prototype V0.2

</footer>



<script>

  const kingdoms =
    document.querySelectorAll(".kingdom");


  const info =
    document.getElementById("info");


  const company =
    document.getElementById("info-company");


  const tier =
    document.getElementById("info-tier");


  const compute =
    document.getElementById("info-compute");


  const future =
    document.getElementById("info-future");



  kingdoms.forEach((kingdom) => {

    kingdom.addEventListener(
      "click",
      () => {

        company.textContent =
          kingdom.dataset.company;

        tier.textContent =
          kingdom.dataset.tier;

        compute.textContent =
          kingdom.dataset.compute;

        future.textContent =
          kingdom.dataset.future;

        info.style.display =
          "block";

      }
    );

  });

</script>


</body>
</html>
